[project]
name = "spreadhunter"
version = "0.1.0"
description = "Sistema de trading desktop - BOX/SBTH/Basket ITM"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "openpyxl>=3.0",
    "psutil>=5.9",
    "PySide6>=6.5",
    "pywin32>=305; sys_platform == 'win32'",
    "requests>=2.31",
    "scipy>=1.17",
    "python-dotenv>=1.0",
    "pyautogui>=0.9",
    "pygetwindow>=0.0.9",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "streamlit>=1.40", "plotly>=5.0"]
simulador = ["streamlit>=1.40", "plotly>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
