[project]
name = "spreadhunter"
version = "0.1.0"
description = "Sistema de trading desktop - BOX/SBTH/Basket ITM"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.0",
    "PyQt5>=5.15",
    "pywin32>=305; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
